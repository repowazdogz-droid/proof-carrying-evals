name: fast-verify (records only, no LLM)
on: [push, pull_request]
jobs:
  verify-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Seals, aggregates, manifest, table and headline counts
        run: python scripts/verify_records.py
      - name: Aggregate-gate unit tests
        run: python -m pytest tests -q
